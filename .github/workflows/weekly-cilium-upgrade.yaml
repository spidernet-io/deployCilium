name: Weekly Cilium Upgrade

on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-cilium-upgrade
  cancel-in-progress: false

jobs:
  prepare-branches:
    name: Discover maintenance branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      branches: ${{ steps.discover.outputs.branches }}

    steps:
      - name: Check out updater branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover and create Cilium minor branches
        id: discover
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CILIUM_UPDATE_TOKEN: ${{ secrets.CILIUM_UPDATE_TOKEN }}
        run: |
          set -euo pipefail

          api_url="https://api.github.com/repos/cilium/cilium/releases?per_page=100"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
            -H "Authorization: Bearer ${GITHUB_TOKEN}"
          )

          releases_json=$(mktemp)
          curl --fail --silent --show-error --location "${headers[@]}" "${api_url}" > "${releases_json}"

          mapfile -t stable_minors < <(
            jq -r '
              .[]
              | select(.draft == false and .prerelease == false)
              | .tag_name
              | select(test("^v?[0-9]+\\.[0-9]+\\.[0-9]+$"))
              | sub("^v"; "")
              | split(".")[0:2]
              | join(".")
            ' "${releases_json}" | sort -Vu
          )

          if [[ ${#stable_minors[@]} -eq 0 ]]; then
            echo "No stable Cilium release found." >&2
            exit 1
          fi

          latest_minor=$(printf '%s\n' "${stable_minors[@]}" | sort -V | tail -n 1)

          mapfile -t branches < <(
            git ls-remote --heads origin 'cilium/v*' |
              sed 's#.*refs/heads/##' |
              sort -V
          )

          branch_exists() {
            local wanted="$1"
            local branch
            for branch in "${branches[@]}"; do
              if [[ "${branch}" == "${wanted}" ]]; then
                return 0
              fi
            done
            return 1
          }

          version_gt() {
            local left="$1"
            local right="$2"
            [[ "${left}" != "${right}" ]] &&
              [[ "$(printf '%s\n%s\n' "${left}" "${right}" | sort -V | tail -n 1)" == "${left}" ]]
          }

          if [[ ${#branches[@]} -gt 0 ]]; then
            source_branch=$(printf '%s\n' "${branches[@]}" | sort -V | tail -n 1)
            highest_minor="${source_branch#cilium/v}"
          else
            source_branch="${GITHUB_REF_NAME}"
            highest_minor="${latest_minor}"
          fi

          for minor in "${stable_minors[@]}"; do
            if [[ ${#branches[@]} -gt 0 ]] && ! version_gt "${minor}" "${highest_minor}"; then
              continue
            fi

            if [[ ${#branches[@]} -eq 0 ]] && [[ "${minor}" != "${latest_minor}" ]]; then
              continue
            fi

            new_branch="cilium/v${minor}"
            if branch_exists "${new_branch}"; then
              source_branch="${new_branch}"
              highest_minor="${minor}"
              continue
            fi

            branch_push_token="${COPILOT_GITHUB_TOKEN:-${GITHUB_TOKEN}}"
            if [[ -z "${branch_push_token}" ]]; then
              echo "Missing token; required to create ${new_branch} from ${source_branch}." >&2
              exit 1
            fi

            echo "Creating ${new_branch} from ${source_branch}."
            git fetch origin "+refs/heads/${source_branch}:refs/remotes/origin/${source_branch}"
            git push \
              "https://x-access-token:${branch_push_token}@github.com/${GITHUB_REPOSITORY}.git" \
              "refs/remotes/origin/${source_branch}:refs/heads/${new_branch}"

            branches+=("${new_branch}")
            source_branch="${new_branch}"
            highest_minor="${minor}"
          done

          branches_json=$(
            printf '%s\n' "${branches[@]}" |
              sort -V |
              jq -R -s -c '
                split("\n")
                | map(select(length > 0))
                | map({
                    branch: .,
                    target_minor: (. | sub("^cilium/v"; ""))
                  })
              '
          )

          echo "Discovered branches: ${branches_json}"
          echo "branches=${branches_json}" >> "${GITHUB_OUTPUT}"

  upgrade:
    name: Check and propose upgrade
    needs: prepare-branches
    if: needs.prepare-branches.outputs.branches != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-branches.outputs.branches) }}

    steps:
      - name: Check out updater scripts
        uses: actions/checkout@v4
        with:
          path: updater
          fetch-depth: 0

      - name: Check out maintenance branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          path: worktree
          fetch-depth: 0

      - name: Read current Cilium version
        id: current
        working-directory: worktree
        run: |
          source cilium/version.sh
          echo "version=${CILIUM_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install AI CLIs and validation tools
        working-directory: worktree
        run: |
          npm install --global \
            @github/copilot@latest \
            @openai/codex@latest
          make install-tools

      - name: Run upgrade script
        id: upgrade
        env:
          CURRENT_CILIUM_VERSION: ${{ steps.current.outputs.version }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          CILIUM_TARGET_MINOR: ${{ matrix.target_minor }}
          CILIUM_PROJECT_ROOT: ${{ github.workspace }}/worktree
          CILIUM_UPDATER_ROOT: ${{ github.workspace }}/updater
        run: |
          updater/cilium/tools/run-cilium-upgrade.sh

      - name: Verify PR token
        if: steps.upgrade.outputs.changed == 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          test -n "${COPILOT_GITHUB_TOKEN}" || {
            echo "Missing repository secret COPILOT_GITHUB_TOKEN" >&2
            exit 1
          }

      - name: Create or update upgrade PR
        if: steps.upgrade.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          path: worktree
          base: ${{ matrix.branch }}
          branch: automation/cilium-v${{ matrix.target_minor }}-latest
          delete-branch: true
          commit-message: |
            chore: 将 Cilium ${{ matrix.target_minor }} 升级至 ${{ steps.upgrade.outputs.latest_version }}
          title: 'chore: 将 Cilium ${{ matrix.target_minor }} 升级至 ${{ steps.upgrade.outputs.latest_version }}'
          body-path: ${{ steps.upgrade.outputs.pr_body_path }}
          add-paths: |
            cilium/**
            test/**
            README.md
            Makefile
            Makefile.defs

      - name: Report pull request
        if: steps.cpr.outputs.pull-request-url
        run: echo "${{ steps.cpr.outputs.pull-request-url }}"
