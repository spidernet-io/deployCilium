name: Validate Cilium Installation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to validate'
        required: false
  pull_request:
    branches:
      - 'cilium/release-v*'
    paths:
      - 'cilium/**'
      - 'test/**'
      - 'Makefile'
      - 'Makefile.defs'
  push:
    branches:
      - 'cilium/release-v*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - run: make install-tools
      - run: make prepare
      - run: make ci-validate

  test-single:
    name: Single Cluster Test
    runs-on: ubuntu-latest
    needs: validate
    env:
      # Keep failed pods in place so `make debug` can describe them.
      DISABLE_HELM_ATOMIC: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - run: make install-tools
      - run: make test-single
      - if: failure()
        run: make debug
      - if: always()
        run: make clean

  test-multi:
    name: Multi-Cluster Test
    runs-on: ubuntu-latest
    needs: validate
    env:
      # Keep failed pods in place so `make debug` can describe them.
      DISABLE_HELM_ATOMIC: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - run: make install-tools
      - run: make test-multi
      - if: failure()
        run: |
          echo "=== Cluster1 Debug ==="
          kubectl config use-context kind-cluster1 && make debug
          echo "=== Cluster2 Debug ==="
          kubectl config use-context kind-cluster2 && make debug
      - if: always()
        run: make clean
