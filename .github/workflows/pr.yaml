name: Validate Cilium Installation

on:
  pull_request:
    branches: [main]
    paths:
      - 'cilium/**'
      - 'test/**'
      - 'Makefile'
      - 'Makefile.defs'
  push:
    branches: [main]

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make install-tools
      - run: make prepare
      - run: make ci-validate

  test-single:
    name: Single Cluster Test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - run: make install-tools
      - run: make test-single
      - if: failure()
        run: make debug
      - if: always()
        run: make clean

  test-multi:
    name: Multi-Cluster Test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - run: make install-tools
      - run: make test-multi
      - if: failure()
        run: |
          echo "=== Cluster1 Debug ==="
          kubectl config use-context kind-cluster1 && make debug
          echo "=== Cluster2 Debug ==="
          kubectl config use-context kind-cluster2 && make debug
      - if: always()
        run: make clean

  comment:
    name: Comment Results
    runs-on: ubuntu-latest
    needs: [validate, test-single, test-multi]
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const results = {
              validate: '${{ needs.validate.result }}',
              single: '${{ needs.test-single.result }}',
              multi: '${{ needs.test-multi.result }}'
            };
            const emoji = (s) => s === 'success' ? '✅' : s === 'failure' ? '❌' : '⚠️';
            const output = `## Cilium Test Results
            
            | Test | Status |
            |------|--------|
            | Configuration | ${emoji(results.validate)} ${results.validate} |
            | Single Cluster | ${emoji(results.single)} ${results.single} |
            | Multi-Cluster | ${emoji(results.multi)} ${results.multi} |
            
            ${Object.values(results).every(r => r === 'success') ? '🎉 All tests passed!' : '⚠️ Some tests failed.'}
            
            **Run locally:**
            \`\`\`bash
            make validate      # Validate configuration only
            make test-single   # Single cluster test
            make test-multi    # Multi-cluster test
            make test-all      # All tests (validate + single + multi)
            make clean         # Clean up all clusters
            \`\`\`
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
