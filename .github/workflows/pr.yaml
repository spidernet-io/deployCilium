name: Validate Cilium Installation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'cilium/**'
      - 'test/**'
      - 'Makefile'
      - 'Makefile.defs'
      - '.github/cilium-supported-versions.json'
  push:
    branches:
      - main

jobs:
  discover-supported-minors:
    name: Discover supported minors
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Cilium minor matrix
        id: discover
        run: |
          set -euo pipefail

          matrix=$(
            jq -c '
              {
                include: (
                  .supported
                  | map(select(.enabled != false))
                  | sort_by(.minor | split(".") | map(tonumber))
                  | map({
                      cilium_minor: ("v" + .minor),
                      target_minor: .minor
                    })
                )
              }
            ' .github/cilium-supported-versions.json
          )

          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  validate:
    name: Validate ${{ matrix.cilium_minor }}
    needs: discover-supported-minors
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-supported-minors.outputs.matrix) }}
    env:
      CILIUM_MINOR: ${{ matrix.cilium_minor }}
    steps:
      - uses: actions/checkout@v4
      - run: make install-tools
      - run: make prepare
      - run: make ci-validate

  test-single:
    name: Single Cluster Test ${{ matrix.cilium_minor }}
    runs-on: ubuntu-latest
    needs:
      - discover-supported-minors
      - validate
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-supported-minors.outputs.matrix) }}
    env:
      CILIUM_MINOR: ${{ matrix.cilium_minor }}
      # Keep failed pods in place so `make debug` can describe them before cleanup.
      DISABLE_HELM_ATOMIC: "true"
    steps:
      - uses: actions/checkout@v4
      - run: make install-tools
      - run: make test-single
      - if: failure()
        run: make debug
      - if: always()
        run: make clean

  test-multi:
    name: Multi-Cluster Test ${{ matrix.cilium_minor }}
    runs-on: ubuntu-latest
    needs:
      - discover-supported-minors
      - validate
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-supported-minors.outputs.matrix) }}
    env:
      CILIUM_MINOR: ${{ matrix.cilium_minor }}
      # Keep failed pods in place so `make debug` can describe them before cleanup.
      DISABLE_HELM_ATOMIC: "true"
    steps:
      - uses: actions/checkout@v4
      - run: make install-tools
      - run: make test-multi
      - if: failure()
        run: |
          echo "=== Cluster1 Debug ==="
          kubectl config use-context kind-cluster1 && make debug
          echo "=== Cluster2 Debug ==="
          kubectl config use-context kind-cluster2 && make debug
      - if: always()
        run: make clean
